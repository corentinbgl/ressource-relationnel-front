<section class="p-6 bg-gray-100 min-h-screen">
    <h1 class="text-3xl font-bold text-blue-600 mb-6 text-center">Modération des ressources</h1>
  
    <div *ngIf="ressourcesNonValidees.length > 0; else rien">
      <div *ngFor="let ressource of ressourcesNonValidees" class="bg-white p-4 mb-4 rounded shadow">
        <h2 class="text-xl font-bold text-blue-500">{{ ressource.titre }}</h2>
        <p class="text-gray-600 mb-2">{{ ressource.description }}</p>
        <p class="text-sm text-gray-400">Catégorie : {{ ressource.categorie }} | Type : {{ ressource.type }}</p>
        <p class="text-xs text-gray-500">Créée le {{ ressource.dateCreation | date:'short' }}</p>
  
        <div class="mt-3">
          <button (click)="valider(ressource)" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
            Valider la ressource
          </button>
        </div>
      </div>
    </div>
  
    <ng-template #rien>
      <p class="text-center text-gray-500">Aucune ressource à valider.</p>
    </ng-template>
  </section>
