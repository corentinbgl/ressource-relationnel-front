<section class="p-6 bg-gray-100 min-h-screen">
    <h1 class="text-3xl font-bold text-blue-600 mb-8 text-center">Ma progression</h1>
  
    <!-- Favoris -->
    <div *ngIf="favoris.length > 0" class="mb-12">
      <h2 class="text-2xl font-semibold text-yellow-600 mb-4">⭐ Mes favoris</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div *ngFor="let res of favoris" class="bg-white p-4 rounded shadow">
          <h3 class="text-lg font-bold text-blue-500">{{ res.titre }}</h3>
          <p class="text-sm text-gray-600">{{ res.description }}</p>
          <a [routerLink]="['/resource', res.id]" class="text-blue-400 hover:underline mt-2 inline-block">Voir</a>
        </div>
      </div>
    </div>
  
    <!-- Exploitées -->
    <div *ngIf="exploitees.length > 0" class="mb-12">
      <h2 class="text-2xl font-semibold text-green-600 mb-4">✅ Ressources exploitées</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div *ngFor="let res of exploitees" class="bg-white p-4 rounded shadow">
          <h3 class="text-lg font-bold text-blue-500">{{ res.titre }}</h3>
          <p class="text-sm text-gray-600">{{ res.description }}</p>
          <a [routerLink]="['/resource', res.id]" class="text-blue-400 hover:underline mt-2 inline-block">Voir</a>
        </div>
      </div>
    </div>
  
    <!-- Mises de côté -->
    <div *ngIf="misesDeCote.length > 0">
      <h2 class="text-2xl font-semibold text-blue-600 mb-4">📌 Ressources mises de côté</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div *ngFor="let res of misesDeCote" class="bg-white p-4 rounded shadow">
          <h3 class="text-lg font-bold text-blue-500">{{ res.titre }}</h3>
          <p class="text-sm text-gray-600">{{ res.description }}</p>
          <a [routerLink]="['/resource', res.id]" class="text-blue-400 hover:underline mt-2 inline-block">Voir</a>
        </div>
      </div>
    </div>
  </section>
